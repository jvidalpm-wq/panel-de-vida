<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Vida</title>
<meta name="theme-color" content="#13294B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Libreta de economista: papel cuadriculado, tinta azul UNAM, acento oro */
:root{
  --paper:#F4F6F9; --grid:#E4E9F0; --sheet:#FFFFFF; --ink:#13294B; --text:#1D2433; --muted:#5C6678; --line:#DAE0E9;
  --blue:#1F4FA3; --blue-ink:#FFFFFF; --gold:#A8812F; --gold-soft:#F5EEDF; --red:#B23A2E; --red-soft:#FBEDEB;
  --green:#2F7A55; --tint:#ECF1F9; --lift:0 1px 0 rgba(19,41,75,.04);
  /* alias de la versión anterior */
  --accent:var(--blue); --chip:var(--tint); --warn:var(--red); --ok:var(--green); --danger:var(--red); --bg:var(--paper); --card:var(--sheet);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0E1727; --grid:#172338; --sheet:#142037; --ink:#E8EEF8; --text:#D9E1EE; --muted:#93A0B6; --line:#24324B;
  --blue:#7FA6EE; --blue-ink:#0B1424; --gold:#D8B56A; --gold-soft:#29251A; --red:#F08A80; --red-soft:#2D1C1F;
  --green:#7CC89D; --tint:#1A2943; --lift:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font:15px/1.55 "Schibsted Grotesk",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:fixed}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Estructura */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 16px;background:var(--sheet);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.025em;color:var(--ink);padding:0 10px;line-height:1.15}
.brand small{display:block;font-size:12px;font-weight:600;letter-spacing:0;color:var(--gold);margin-top:2px}
#tabs{display:flex;flex-direction:column;gap:2px}
#tabs button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
#tabs button:hover{color:var(--ink);background:var(--tint)}
#tabs button.on{color:var(--ink);background:var(--tint);box-shadow:inset 3px 0 0 var(--gold)}
#tabs button:focus-visible{outline:2px solid var(--gold)}
.main{padding:34px 44px 120px;max-width:1120px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 24px;flex-wrap:wrap;margin-bottom:24px}
.hero-day{font-size:15px;font-weight:700;color:var(--gold);text-transform:capitalize}
.hero-date{font-size:clamp(38px,6.4vw,62px);font-weight:800;letter-spacing:-.04em;line-height:.98;color:var(--ink)}
.hero-sub{margin:10px 0 0;color:var(--muted);max-width:62ch}
.hero-sub b{color:var(--ink)}
.vt{font-size:clamp(28px,4vw,36px);font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:0;line-height:1.1}
#sync{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:340px}
#syncmsg{font-size:13px;color:var(--muted)}

/* Eje del día: lo memorable */
.tl{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 18px 8px;margin-bottom:18px;box-shadow:var(--lift)}
.tl-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-top:16px;margin-top:-10px}
.tl-in{min-width:620px;position:relative;padding-right:6px}
.tl-track{position:relative;min-height:32px}
.tl-blk{position:absolute;height:28px;border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--blue);color:var(--blue-ink)}
.tl-blk.ev{background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.tl-blk.done{background:var(--green);color:var(--sheet)}
.tl-blk.cancel{background:transparent;color:var(--muted);border:1px dashed var(--muted);text-decoration:line-through}
.tl-axis{position:relative;height:24px;border-top:2px solid var(--ink);margin-top:8px}
.tl-axis span{position:absolute;top:4px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-axis span::before{content:"";position:absolute;left:50%;top:-8px;width:1px;height:6px;background:var(--ink)}
.tl-now{position:absolute;top:-6px;bottom:-12px;width:2px;background:var(--red);border-radius:2px}
.tl-now::after{content:"ahora";position:absolute;top:-16px;left:4px;font-size:11px;font-weight:700;color:var(--red)}
.tl-empty{padding:2px 0 8px}

/* Bloques de contenido */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--lift)}
.card h2{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:0 0 8px}
.card.quiet{background:transparent;border-style:dashed;box-shadow:none}
.alert{background:var(--gold-soft);border-left:3px solid var(--gold);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-weight:600}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.time{min-width:58px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.grow{flex:1;min-width:0}
.title{font-weight:700;color:var(--ink)}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;background:var(--tint);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--ink);margin-right:4px}
.tag.due{background:var(--red-soft);color:var(--red)}
.cancel .title{text-decoration:line-through;color:var(--muted)}
.done .title{color:var(--green)}
.money{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);white-space:nowrap}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.neg{color:var(--red)}
.pos{color:var(--green)}

/* Controles */
button.b,a.b,label.b{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
button.b:hover,a.b:hover,label.b:hover{border-color:var(--ink)}
button.p{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
button.p:hover{filter:brightness(1.08)}
button.d{color:var(--red)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.req{display:flex;gap:8px;align-items:center;font-size:14px}
.empty{color:var(--muted);padding:6px 0}
.day{margin-bottom:18px}
.day h3{margin:0 0 4px;text-transform:capitalize;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.dots{display:flex;gap:4px;margin-top:4px}
.dot{width:14px;height:14px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--gold)}
.planb{background:var(--gold-soft);border-left:3px solid var(--gold);padding:7px 11px;border-radius:6px;margin-top:8px;font-size:14px;color:var(--ink)}
input,select,textarea{width:100%;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--tint)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--blue);flex:none}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--sheet);color:var(--text);max-width:480px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(14,23,39,.5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soon{opacity:.75}
code{background:var(--tint);padding:1px 6px;border-radius:5px;color:var(--ink)}
ol.steps{padding-left:20px}ol.steps li{margin:4px 0}
.status{font-size:13px;color:var(--muted);margin-top:8px}
.bar{height:7px;background:var(--tint);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar>i.over{background:var(--red)}
.line2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.menu{display:grid;gap:10px;max-width:460px}
.menu .b{justify-content:flex-start;padding:16px 18px;font-size:16px;border-radius:12px}

.fab{position:fixed;right:24px;bottom:24px;z-index:5;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 22px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 24px rgba(19,41,75,.28)}
.bottom{display:none}

/* Celular */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:22px 16px 150px}
  .cols{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr 1fr}
  #sync{max-width:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{all:unset;flex:1;text-align:center;padding:10px 2px 8px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:8px;cursor:pointer;position:relative}
  .bottom button.on{color:var(--ink)}
  .bottom button.on::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
  .bottom button:focus-visible{outline:2px solid var(--gold)}
  .fab{right:16px;bottom:calc(74px + env(safe-area-inset-bottom));padding:12px 18px}
}
@media (prefers-reduced-motion:no-preference){
  .tl-blk{animation:grow .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">Panel de Vida<small>Economía UNAM, semestre 2027-1</small></div><nav id="tabs" aria-label="Secciones"></nav></aside>
  <main class="main"><header class="top" id="top"></header><div id="view"></div></main>
</div>
<nav class="bottom" id="btabs" aria-label="Secciones"></nav>
<button class="fab" data-act="new-plan">+ Actividad</button>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>

<script src="datos-iniciales.js"></script>
<script>
/* ========== Utilidades ========== */
const KEY='panelDeVida.v1';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayStr=()=>ymd(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtDay=d=>d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=d=>d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
const fmtTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};

/* ========== Estado ========== */
const DEFAULTS={plans:[],blockers:[],habits:[],
  projects:(window.PDV_SEED||{}).projects||[],
  goals:(window.PDV_SEED||{}).goals||[],
  settings:{clientId:'',sheetId:(window.PDV_SEED||{}).sheetId||'',classesEnd:'2026-12-11',returnDate:'2027-01-04'},
  cache:{events:[],updated:null}};
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));
    if(r)return {...DEFAULTS,...r,settings:{...DEFAULTS.settings,...r.settings},cache:{...DEFAULTS.cache,...r.cache}};
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
let S=load();
// Link de configuración personal: ...#cid=CLIENT_ID&sheet=ID_HOJA (se guarda y se borra de la barra)
try{const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('cid')||h.get('sheet')){if(h.get('cid'))S.settings.clientId=h.get('cid');if(h.get('sheet'))S.settings.sheetId=h.get('sheet');
    localStorage.setItem(KEY,JSON.stringify(S));history.replaceState(null,'',location.pathname)}}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('No pude guardar: '+e.message)}}
function save(){ // guarda local y, si hay conexión, sube a la hoja en 1.5 s
  S.updatedAt=Date.now();saveLocal();
  if(token&&S.settings.sheetId){clearTimeout(pushTimer);pushTimer=setTimeout(()=>pushPanel().then(()=>gsSt('Guardado en la nube.')).catch(e=>gsSt('No pude guardar en la nube: '+e.message)),1500)}
}
let view='hoy', weekStart=new Date(); weekStart.setHours(0,0,0,0);

/* ========== Eventos de Google (solo lectura) ========== */
function gEvents(){return (S.cache.events||[]).map(e=>({...e,start:new Date(e.start),end:new Date(e.end)}))}
function eventsOn(dateStr,{classroom}={}){
  const d0=parseYmd(dateStr),d1=addDays(d0,1);
  return gEvents().filter(e=>e.start<d1&&e.end>d0&&(classroom===undefined||e.classroom===classroom))
    .sort((a,b)=>a.start-b.start);
}

/* ========== Hueco libre para reprogramar ========== */
function findSlot(plan){
  const dur=plan.dur||60, now=new Date();
  for(let off=0;off<=14;off++){
    const day=addDays(new Date(now.getFullYear(),now.getMonth(),now.getDate()),off), ds=ymd(day);
    const busy=[];
    S.plans.filter(p=>p.id!==plan.id&&p.date===ds&&p.status!=='cancelado'&&p.time)
      .forEach(p=>busy.push([toMin(p.time),toMin(p.time)+(p.dur||60)]));
    eventsOn(ds,{classroom:false}).filter(e=>!e.allDay).forEach(e=>{
      const s=Math.max(0,(e.start-day)/6e4), f=Math.min(1440,(e.end-day)/6e4); busy.push([s,f]);});
    let from=8*60; if(off===0) from=Math.max(from,Math.ceil((now.getHours()*60+now.getMinutes()+30)/30)*30);
    for(let t=from;t+dur<=21*60;t+=30){
      if(!busy.some(([a,b])=>t<b&&t+dur>a)) return {date:ds,time:`${pad(Math.floor(t/60))}:${pad(t%60)}`};
    }
  }
  return null;
}

/* ========== Render ========== */
const TABS=[['hoy','Hoy'],['agenda','Agenda'],['finanzas','Dinero'],['proyectos','Proyectos'],['metas','Metas'],['pendientes','Pendientes'],['habitos','Hábitos'],['mas','Próximamente'],['ajustes','Ajustes']];
const MAIN_TABS=['hoy','agenda','finanzas','proyectos'];
function render(){
  const prev=$('#syncmsg')?.textContent||'', now=new Date();
  const last=S.cache.updated?'Sincronizado '+new Date(S.cache.updated).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  const sync=`<div id="sync"><button class="b ${token?'':'p'}" data-act="gconnect">${token?'Sincronizar':'Conectar Google'}</button><span id="syncmsg">${esc(prev||last)}</span></div>`;
  const title=view==='menu'?'Más':(TABS.find(t=>t[0]===view)||[,''])[1];
  $('#top').innerHTML=(view==='hoy'
    ?`<div class="hero"><div class="hero-day">${now.toLocaleDateString('es-MX',{weekday:'long'})}</div><div class="hero-date">${now.getDate()} de ${now.toLocaleDateString('es-MX',{month:'long'})}</div>${banner()}</div>`
    :`<h1 class="vt">${esc(title)}</h1>`)+sync;
  $('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="${view===k?'on':''}" data-act="tab" data-v="${k}">${n}</button>`).join('');
  $('#btabs').innerHTML=MAIN_TABS.map(k=>`<button class="${view===k?'on':''}" data-act="tab" data-v="${k}">${TABS.find(t=>t[0]===k)[1]}</button>`).join('')
    +`<button class="${MAIN_TABS.includes(view)?'':'on'}" data-act="tab" data-v="menu">Más</button>`;
  $('#view').innerHTML=({hoy:vHoy,agenda:vAgenda,finanzas:vFin,proyectos:vProy,metas:vMeta,pendientes:vPend,habitos:vHab,mas:vMas,ajustes:vAjustes,menu:vMenu})[view]();
  if(view==='finanzas')updRegForm();
}
function vMenu(){
  return `<div class="menu">${TABS.filter(t=>!MAIN_TABS.includes(t[0])).map(([k,n])=>`<button class="b" data-act="tab" data-v="${k}">${n}</button>`).join('')}</div>`;
}

function banner(){
  const t=parseYmd(todayStr()),ret=parseYmd(S.settings.returnDate),end=parseYmd(S.settings.classesEnd);
  const f=(d,o)=>d.toLocaleDateString('es-MX',o);
  if(t<ret&&t>end){const n=Math.round((ret-t)/864e5);
    return `<p class="hero-sub"><b>${n} días de descanso.</b> Regresas el ${f(ret,{day:'numeric',month:'long'})} para terminar finales: buen momento para ponerte al día con trámites.</p>`;}
  if(t<=end){const n=Math.round((end-t)/864e5);
    return `<p class="hero-sub"><b>${n} días para terminar clases</b> el ${f(end,{day:'numeric',month:'long'})}. Después, descanso hasta el ${f(ret,{day:'numeric',month:'long'})}.</p>`;}
  return '';
}

/* Eje del día (7:00 a 23:00), con carriles cuando hay choques */
function timeline(ds){
  const A=7*60,B=23*60,pct=m=>Math.max(0,Math.min(100,(m-A)/(B-A)*100)),d0=parseYmd(ds);
  const its=[];
  S.plans.filter(p=>p.date===ds&&p.time).forEach(p=>{const s=toMin(p.time);its.push({s,e:s+(p.dur||60),t:p.title,c:p.status==='cancelado'?'cancel':p.status==='hecho'?'done':''})});
  eventsOn(ds,{classroom:false}).filter(e=>!e.allDay).forEach(e=>its.push({s:Math.max(0,(e.start-d0)/6e4),e:Math.min(1440,(e.end-d0)/6e4),t:e.title,c:'ev'}));
  const vis=its.filter(i=>i.e>A&&i.s<B).sort((a,b)=>a.s-b.s),lanes=[];
  vis.forEach(i=>{let l=lanes.findIndex(end=>end<=i.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=i.e;i.l=l});
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),ticks=[];
  for(let h=8;h<=22;h+=2)ticks.push(`<span style="left:${pct(h*60)}%">${h}:00</span>`);
  return `<section class="tl" aria-label="Tu día de un vistazo"><div class="tl-scroll"><div class="tl-in">
    <div class="tl-track" style="height:${Math.max(1,lanes.length)*34}px">${vis.map(i=>`<div class="tl-blk ${i.c}" style="left:${pct(i.s)}%;width:max(${(pct(i.e)-pct(i.s)).toFixed(2)}%,30px);top:${i.l*34}px" title="${esc(i.t)}">${esc(i.t)}</div>`).join('')}
    ${ds===todayStr()&&nm>A&&nm<B?`<div class="tl-now" style="left:${pct(nm)}%"></div>`:''}</div>
    <div class="tl-axis">${ticks.join('')}</div></div></div>
    ${vis.length?'':'<div class="meta tl-empty">Tu día está libre. Las actividades con hora aparecen aquí.</div>'}</section>`;
}

function planItem(p){
  const reqs=(p.reqs||[]).map((r,i)=>`<label class="req" style="margin:0;color:var(--ink);font-weight:400"><input type="checkbox" style="width:auto" data-act="req" data-id="${p.id}" data-i="${i}" ${r.done?'checked':''}> ${esc(r.t)}</label>`).join('');
  const st=p.status==='cancelado'?'cancel':p.status==='hecho'?'done':'';
  let extra='';
  if(p.status==='cancelado'){
    extra+=p.planB?`<div class="planb"><b>Plan B:</b> ${esc(p.planB)}</div>`:'';
    if(p.suggest){const d=parseYmd(p.suggest.date);
      extra+=`<div class="row"><button class="b p" data-act="move" data-id="${p.id}">Mover a ${fmtShort(d)} · ${p.suggest.time}</button><button class="b" data-act="resuggest" data-id="${p.id}">Otro hueco</button></div>`;}
    else extra+=`<div class="meta">No encontré hueco en 2 semanas.</div>`;
  }
  const btns=p.status==='pendiente'?`<button class="b" data-act="done" data-id="${p.id}">Hecho</button><button class="b" data-act="cancel" data-id="${p.id}">Se canceló</button>`:`<button class="b" data-act="undo" data-id="${p.id}">Reabrir</button>`;
  return `<div class="item ${st}"><div class="time">${p.time||'—'}</div><div class="grow">

function dayList(ds){
  const plans=S.plans.filter(p=>p.date===ds).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

  const out=[...plans.map(p=>({k:(p.time||'99:99'),h:planItem(p)})),...evs.map(e=>({k:e.allDay?'00:00':fmtTime(e.start),h:evItem(e)}))].sort((a,b)=>a.k.localeCompare(b.k));

function streak(h){let n=0,d=new Date();if(!h.log[ymd(d)])d=addDays(d,-1);while(h.log[ymd(d)]){n++;d=addDays(d,-1)}return n}

function openPlan(id){

  $('#form').innerHTML=`<h2 style="margin:0 0 4px">${id?'Editar':'Nueva'} actividad</h2>

  <label>Duración (minutos)</label><input type="number" name="dur" min="15" step="15" value="${p.dur||60}">
  <label>Qué necesito para hacerla (uno por línea)</label><textarea name="reqs" rows="3" placeholder="Documentos&#10;Ropa deportiva">${esc((p.reqs||[]).map(r=>r.t).join('\n'))}</textarea>
  <label>Plan B si se cae</label><input name="planB" value="${esc(p.planB||'')}" placeholder="Ej. 20 min de estudio en casa">
  <label>Notas</label><input name="notes" value="${esc(p.notes||'')}">

  $('#dlg').showModal();
}
$('#form').addEventListener('submit',e=>{
  const f=new FormData($('#form')); if(e.submitter?.value!=='ok')return;
  const id=e.submitter.dataset.id, old=S.plans.find(x=>x.id===id);
  const reqs=(f.get('reqs')||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,done:!!old?.reqs?.find(r=>r.t===t&&r.done)}));
  const obj={id:id||uid(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),dur:+f.get('dur')||60,reqs,planB:f.get('planB').trim(),notes:f.get('notes').trim(),status:old?.status||'pendiente',suggest:old?.suggest};
  if(old)Object.assign(old,obj);else S.plans.push(obj);
  save();render();
});

/* ========== Acciones ========== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='INPUT')return;
  const a=b.dataset.act,id=b.dataset.id,p=S.plans.find(x=>x.id===id);
  if(a==='tab'){view=b.dataset.v;render();window.scrollTo(0,0);return}
  else if(a==='new-plan'){openPlan();return}
  else if(a==='edit'){openPlan(id);return}
  else if(a==='done'){p.status='hecho'}
  else if(a==='undo'){p.status='pendiente';delete p.suggest}
  else if(a==='cancel'){p.status='cancelado';p.suggest=findSlot(p)}
  else if(a==='resuggest'){const keep={...p};const s=findSlotAfter(p);p.suggest=s}
  else if(a==='move'){p.date=p.suggest.date;p.time=p.suggest.time;p.status='pendiente';delete p.suggest}
  else if(a==='del'){if(!confirm('¿Borrar esta actividad?'))return;S.plans=S.plans.filter(x=>x.id!==id)}
  else if(a==='delsub'){const pr=S.projects.find(x=>x.id===b.dataset.p);pr.sub=pr.sub.filter(s=>s.id!==id)}
  else if(a==='delblk'){S.blockers=S.blockers.filter(x=>x.id!==id)}
  else if(a==='delhab'){if(!confirm('¿Quitar este hábito?'))return;S.habits=S.habits.filter(x=>x.id!==id)}
  else if(a==='wk'){const n=+b.dataset.n;if(n===0){weekStart=new Date();weekStart.setHours(0,0,0,0)}else weekStart=addDays(weekStart,n);render();return}
  else if(a==='savecid'){S.settings.clientId=$('#cid').value.trim();S.settings.sheetId=$('#shid').value.trim();saveLocal();gsSt('Guardado.');return}
  else if(a==='savedates'){S.settings.classesEnd=$('#cend').value;S.settings.returnDate=$('#ret').value}
  else if(a==='gconnect'){if($('#cid')){S.settings.clientId=$('#cid').value.trim();S.settings.sheetId=$('#shid').value.trim();saveLocal()}gConnect();return}
  else if(a==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=`panel-de-vida-${todayStr()}.json`;l.click();return}
  save();render();
});
function findSlotAfter(p){ // siguiente hueco distinto al sugerido
  const cur=p.suggest; if(!cur)return findSlot(p);
  const tmp={...p,id:'__tmp'}; const hold={id:'__hold',date:cur.date,time:cur.time,dur:p.dur,status:'pendiente'};
  S.plans.push(hold); const s=findSlot(tmp); S.plans=S.plans.filter(x=>x.id!=='__hold'); return s||cur;
}
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='regcon'){updRegForm();return}
  const a=t.dataset?.act; if(!a&&t.id!=='imp')return;
  if(a==='req'){const p=S.plans.find(x=>x.id===t.dataset.id);p.reqs[+t.dataset.i].done=t.checked}
  else if(a==='blk'){S.blockers.find(x=>x.id===t.dataset.id).done=t.checked}
  else if(a==='sub'){S.projects.find(x=>x.id===t.dataset.p).sub.find(s=>s.id===t.dataset.id).done=t.checked}
  else if(a==='pnext'){S.projects.find(x=>x.id===t.dataset.p).next=t.value}
  else if(a==='gnext'){S.goals.find(x=>x.id===t.dataset.id).next=t.value}
  else if(a==='hab'){const h=S.habits.find(x=>x.id===t.dataset.id);if(t.checked)h.log[t.dataset.d]=true;else delete h.log[t.dataset.d]}
  else if(t.id==='imp'){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Respaldo restaurado.')}catch(x){alert('Archivo inválido')}};r.readAsText(t.files[0]);return}
  save();render();
});
document.addEventListener('submit',e=>{
  const fm=e.target.dataset?.form; if(!fm)return; e.preventDefault();
  const f=new FormData(e.target);
  if(fm==='reg'){registrar(f);return}
  if(fm==='blk')S.blockers.push({id:uid(),title:f.get('title').trim(),due:f.get('due'),planId:f.get('planId'),done:false});
  if(fm==='hab')S.habits.push({id:uid(),name:f.get('name').trim(),log:{}});
  if(fm==='sub')S.projects.find(x=>x.id===f.get('pid')).sub.push({id:uid(),t:f.get('t').trim(),done:false});
  save();render();
});

/* ========== Google (Calendar + Sheets) ========== */
const SCOPES='https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/spreadsheets';
const SHEETS='https://sheets.googleapis.com/v4/spreadsheets/';
const sid=()=>S.settings.sheetId;
let tokenClient,token=null;
try{const t=JSON.parse(sessionStorage.getItem('pdv.tok'));if(t&&t.exp>Date.now())token=t.v}catch(e){}
function gsSt(m){const a=$('#gstatus');if(a)a.textContent=m;const b=$('#syncmsg');if(b)b.textContent=m}
function loadGsi(){return new Promise((res,rej)=>{if(window.google?.accounts){res();return}
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('No pude cargar Google (¿sin internet?)'));document.head.appendChild(s)})}
async function gConnect(){
  if(!S.settings.clientId){view='ajustes';render();gsSt('Primero pega tu Client ID en Ajustes.');return}
  if(location.protocol==='file:'){gsSt('Abre el panel con iniciar-panel.bat o desde su link web.');return}
  try{await loadGsi();
    if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:S.settings.clientId,scope:SCOPES,
      callback:async r=>{if(r.error){gsSt('Error: '+r.error);return}
        token=r.access_token;try{sessionStorage.setItem('pdv.tok',JSON.stringify({v:token,exp:Date.now()+((r.expires_in||3600)-60)*1000}))}catch(e){}
        await syncAll();}});
    tokenClient.requestAccessToken({prompt:''});
  }catch(x){gsSt(x.message)}
}
async function gfetch(u,opt={}){
  const r=await fetch(u,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});
  if(r.status===401){token=null;try{sessionStorage.removeItem('pdv.tok')}catch(e){};throw new Error('Sesión vencida: pulsa Sincronizar')}
  if(!r.ok){let t='';try{t=(await r.json()).error.message}catch(e){};throw new Error('HTTP '+r.status+' '+t)}
  return r.json();
}
async function sGet(ranges){
  const q=ranges.map(r=>'ranges='+encodeURIComponent(r)).join('&');
  const d=await gfetch(`${SHEETS}${sid()}/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE`);
  return d.valueRanges.map(v=>v.values||[]);
}
async function sPut(data){return gfetch(`${SHEETS}${sid()}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})})}

async function syncAll(){
  gsSt('Sincronizando…');const errs=[];
  try{await syncCalendar()}catch(x){errs.push('Calendario: '+x.message)}
  if(sid()){
    try{await syncPanelData()}catch(x){errs.push('Datos del panel: '+x.message)}
    try{await loadFin()}catch(x){errs.push('Finanzas: '+x.message)}
  }
  render();gsSt(errs.length?errs.join(' · '):'Todo sincronizado.');
}

/* --- Datos del panel guardados en la pestaña oculta PANEL de la hoja --- */
const SYNC_KEYS=['plans','blockers','habits','projects','goals'];
let pushTimer=null;
async function ensurePanelSheet(){
  const d=await gfetch(`${SHEETS}${sid()}?fields=sheets.properties.title`);
  if(!d.sheets.some(s=>s.properties.title==='PANEL'))
    await gfetch(`${SHEETS}${sid()}:batchUpdate`,{method:'POST',body:JSON.stringify({requests:[{addSheet:{properties:{title:'PANEL',hidden:true}}}]})});
}
async function readRemote(){
  const [v]=await sGet(['PANEL!A1:A20']);const j=v.map(r=>r[0]||'').join('');
  try{return j?JSON.parse(j):null}catch(e){return null}
}
function applyRemote(r){
  SYNC_KEYS.forEach(k=>{if(r[k])S[k]=r[k]});S.settings={...S.settings,...(r.settings||{})};
  S.updatedAt=r.updatedAt;S.baseRemote=r.updatedAt;S.synced=true;saveLocal();
}
async function pushPanel(){
  await ensurePanelSheet();
  const remote=await readRemote();
  if(S.synced&&remote&&(remote.updatedAt||0)>(S.baseRemote||0)){applyRemote(remote);render();gsSt('Cargué cambios hechos en otro dispositivo.');return}
  const o={updatedAt:S.updatedAt||Date.now(),settings:{classesEnd:S.settings.classesEnd,returnDate:S.settings.returnDate}};
  SYNC_KEYS.forEach(k=>o[k]=S[k]);
  const j=JSON.stringify(o),parts=[];for(let i=0;i<j.length;i+=40000)parts.push([j.slice(i,i+40000)]);
  if(parts.length>20)throw new Error('Datos demasiado grandes');
  while(parts.length<20)parts.push(['']);
  await sPut([{range:'PANEL!A1:A20',values:parts},{range:'PANEL!B1',values:[['Datos del Panel de Vida. No editar a mano.']]}]);
  S.baseRemote=o.updatedAt;S.updatedAt=o.updatedAt;S.synced=true;saveLocal();
}
async function syncPanelData(){
  await ensurePanelSheet();
  const remote=await readRemote();
  const localChanged=(S.updatedAt||0)>(S.baseRemote||0);
  if(remote&&(!S.synced||(remote.updatedAt||0)>(S.baseRemote||0)))applyRemote(remote);
  else if(!remote||localChanged)await pushPanel();
}

/* --- Finanzas: lee y escribe tu hoja de presupuesto --- */
const dateToSerial=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5+25569};
const serialYmd=n=>{const d=new Date(Math.round((n-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const money=n=>(n<0?'-':'')+'$'+Math.abs(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const cellEmpty=r=>{const v=(r||[])[0];return v===undefined||v===''};
let FIN=S.cache.fin||null;
async function loadFin(){
  const [res,reg,lis,cuentas,dest,deu,cat,apa,pre]=await sGet(['RESUMEN!B5:C9','REGISTRO!C6:L1505','LISTAS!A2:C41','LISTAS!M2:M10','LISTAS!Q2:Q30','DEUDAS!B6:I20',"'CATALOGO DE CUENTAS'!B7:E20",'APARTADOS!C6:F505','PRESUPUESTO!B5:O48']);
  const now=new Date(),mSer=dateToSerial(`${now.getFullYear()}-${pad(now.getMonth()+1)}-01`);
  const rows=reg.filter(r=>!cellEmpty(r));
  const porC={};let ing=0,gas=0;
  rows.forEach(r=>{if(r[8]!==mSer)return;const t=r[9]||'';
    if(/GASTO/.test(t)&&+r[4]<0){porC[r[2]]=(porC[r[2]]||0)-r[4];gas-=r[4]}
    if(t==='INGRESO'&&+r[3]>0)ing+=+r[3];});
  const head=pre[0]||[],col=head.findIndex(v=>v===mSer),pres={};
  if(col>1)pre.slice(1).forEach(r=>{if(r[0]&&+r[col])pres[r[0]]=+r[col]});
  const conceptos=[...new Set([...Object.keys(porC),...Object.keys(pres)])].map(c=>({c,gasto:porC[c]||0,pres:pres[c]||0})).sort((a,b)=>b.gasto-a.gasto);
  const apSaldo={};apa.forEach(r=>{if(r[1]&&typeof r[3]==='number')apSaldo[r[1]]=(apSaldo[r[1]]||0)+r[3]});
  FIN={updated:Date.now(),
    cuentas:res.filter(r=>r[0]&&typeof r[1]==='number'),
    movs:rows.slice(-8).reverse().map(r=>({f:r[0],cta:r[1],c:r[2],m:(+r[3]||0)+(+r[4]||0),dest:r[5]||'',nota:r[7]||''})),
    listas:{conceptos:lis.filter(r=>r[0]).map(r=>({c:r[0],t:r[1],dest:r[2]})),cuentas:cuentas.flat().filter(Boolean),destinos:dest.flat().filter(Boolean)},
    deudas:deu.filter(r=>r[0]).map(r=>({a:r[0],ini:+r[1]||0,saldo:+r[5]||0,est:r[6]||'',prox:typeof r[7]==='number'?serialYmd(r[7]):''})),
    apartados:cat.filter(r=>r[0]).map(r=>({n:r[0],meta:+r[3]||0,saldo:apSaldo[r[0]]||0})),
    mes:{label:now.toLocaleDateString('es-MX',{month:'long',year:'numeric'}),ing,gas,conceptos}};
  S.cache.fin=FIN;saveLocal();
}
async function registrar(f){
  const st=$('#regmsg');
  const fecha=dateToSerial(f.get('fecha')),cta=f.get('cuenta'),con=f.get('concepto'),dest=f.get('dest')||'',nota=(f.get('nota')||'').trim();
  const monto=Math.abs(parseFloat(String(f.get('monto')).replace(',','.')));
  const info=FIN.listas.conceptos.find(x=>x.c===con)||{};
  if(!(monto>0)){st.textContent='Escribe un monto válido.';return}
  if(info.dest==='SI'&&!dest){st.textContent=`«${con}» necesita cuenta destino.`;return}
  st.textContent='Guardando en tu hoja…';
  try{
    const [colC,colA]=await sGet(['REGISTRO!C6:C1505','APARTADOS!C6:C505']);
    let i=0;while(i<colC.length&&!cellEmpty(colC[i]))i++;
    const r0=6+i,data=[];
    const add=(r,c,a,ingreso,egreso,d,n)=>{
      data.push({range:`REGISTRO!C${r}:E${r}`,values:[[fecha,c,con]]});
      if(ingreso)data.push({range:`REGISTRO!F${r}`,values:[[ingreso]]});
      if(egreso)data.push({range:`REGISTRO!G${r}`,values:[[-egreso]]});
      if(d)data.push({range:`REGISTRO!H${r}`,values:[[d]]});
      if(n)data.push({range:`REGISTRO!J${r}`,values:[[n]]});};
    let msg;
    if(info.t==='TRASPASO'&&FIN.listas.cuentas.includes(dest)){
      if(dest===cta){st.textContent='Origen y destino son la misma cuenta.';return}
      if(r0+1>1505)throw new Error('REGISTRO lleno');
      add(r0,cta,con,0,monto,dest,nota);add(r0+1,dest,con,monto,0,cta,nota);
      msg=`Traspaso registrado en 2 renglones (${r0} y ${r0+1}).`;
    }else{
      if(r0>1505)throw new Error('REGISTRO lleno');
      const esIng=f.get('mov')==='ingreso';
      add(r0,cta,con,esIng?monto:0,esIng?0:monto,dest,nota);msg=`Registrado en el renglón ${r0}.`;
      if(con==='APARTADOS/AHORROS'&&FIN.apartados.some(a=>a.n===dest)){
        let j=0;while(j<colA.length&&!cellEmpty(colA[j]))j++;const ra=6+j;
        data.push({range:`APARTADOS!C${ra}:F${ra}`,values:[[fecha,dest,'Deposito',monto]]},{range:`APARTADOS!H${ra}`,values:[['Desde Panel de Vida']]});
        msg+=` Depósito en APARTADOS (${dest}).`;
      }
    }
    await sPut(data);await loadFin();render();const s2=$('#regmsg');if(s2)s2.textContent='✓ '+msg;
  }catch(x){st.textContent='Error: '+x.message}
}

async function syncCalendar(){
  const cl=await gfetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250');
  const min=addDays(new Date(),-1),max=addDays(new Date(),60),out=[];
  for(const c of cl.items){
    const q=new URLSearchParams({timeMin:min.toISOString(),timeMax:max.toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:'250'});
    let d;try{d=await gfetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(c.id)}/events?${q}`)}catch(e){continue}
    const classroom=/classroom/i.test(c.id), calName=c.summaryOverride||c.summary;
    for(const e of d.items||[]){
      const allDay=!!e.start.date; const s=allDay?parseYmd(e.start.date):new Date(e.start.dateTime), f=allDay?parseYmd(e.end.date):new Date(e.end.dateTime);
      out.push({id:e.id,title:e.summary||'(sin título)',start:s.toISOString(),end:f.toISOString(),allDay,classroom,calName});
    }
  }
  S.cache={...S.cache,events:out,updated:new Date().toISOString()};saveLocal();
}

render();
if(token&&S.settings.clientId)syncAll();
</script>
